    <script>
        function twUseCdn() {
            if (window.__twCdn) return; window.__twCdn = true;
            var s = document.createElement('script'); s.src = 'https://cdn.tailwindcss.com'; document.head.appendChild(s);
        }
        function twCheck() {
            var p = document.createElement('div'); p.className = 'hidden'; document.documentElement.appendChild(p);
            var ok = getComputedStyle(p).display === 'none'; p.remove();
            if (!ok) twUseCdn();

    <style>
        body {
            font-family: 'Brain', 'Noto Sans', 'Noto Sans Sinhala', 'Noto Sans Tamil', sans-serif;
            background-color: #0b132b;
            color: #ffffff;
            overflow: hidden;
            user-select: none;
        }
        .slide-container {
            display: none;
        }
        .slide-container.active {
            display: flex;
        }
        @keyframes pulse-glow {
            0%, 100% { transform: scale(1); filter: drop-shadow(0 0 15px rgba(239, 68, 68, 0.8)); }
            50% { transform: scale(1.05); filter: drop-shadow(0 0 35px rgba(239, 68, 68, 1)); }
        }
        .animate-brain {
            animation: pulse-glow 3s infinite ease-in-out;
        }
        @keyframes float-slow {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }
        .animate-float {
            animation: float-slow 4s infinite ease-in-out;
        }
        @keyframes tick-spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .animate-tick {
            animation: tick-spin 60s linear infinite;
        }
        @keyframes pulse-clot {
            0%, 100% { transform: scale(1); opacity: 0.9; }
            50% { transform: scale(1.1); opacity: 1; }
        }
        .animate-clot {
            animation: pulse-clot 2s infinite ease-in-out;
            transform-box: fill-box;
            transform-origin: center;
        }
        @keyframes blood-flow {
            to { stroke-dashoffset: -40; }
        }
        .animate-flow {
            animation: blood-flow 1.2s linear infinite;
        }
        @keyframes burst-spread {
            0% { transform: scale(0.4); opacity: 0.2; }
            70% { opacity: 0.9; }
            100% { transform: scale(1.15); opacity: 0; }
        }
        .animate-burst {
            animation: burst-spread 2.2s infinite ease-out;
            transform-box: fill-box;
            transform-origin: center;
        }
        /* Small testing label (hidden with &kiosk=1) */
        #test-label {
            position: fixed; top: 6px; right: 10px; z-index: 100;
            font: 600 14px/1.2 monospace; color: #e2e8f0;
            background: rgba(0, 0, 0, 0.65); padding: 4px 10px; border-radius: 8px;
            pointer-events: none;
        }
    </style>

                                    <p class="text-xl md:text-2xl text-slate-300 leading-relaxed">${slideData.ischaemicDesc}</p>
                                </div>
                                <!-- Haemorrhagic Stroke AI Image Card -->
                                <div class="bg-slate-900/90 border-2 border-amber-500/50 p-6 rounded-3xl flex flex-col items-center text-left space-y-4 shadow-xl">
                                    <div class="w-full flex justify-center bg-slate-950 p-3 rounded-2xl border border-slate-800 overflow-hidden">
                                        <svg viewBox="0 0 480 220" class="rounded-xl w-full h-[220px] border border-amber-500/30" role="img" aria-label="Haemorrhagic stroke: a blood vessel bursts">
                                            <rect width="480" height="220" fill="#33220f"/>
                                            <path d="M0 120 C100 80 180 150 240 112" fill="none" stroke="#b91c1c" stroke-width="40" stroke-linecap="round"/>
                                            <path d="M262 104 C330 70 410 140 480 100" fill="none" stroke="#b91c1c" stroke-width="40" stroke-linecap="round"/>
                                            <path d="M0 120 C100 80 180 150 232 116" fill="none" stroke="#fca5a5" stroke-width="5" stroke-dasharray="14 26" class="animate-flow"/>
                                            <circle cx="251" cy="108" r="70" fill="#dc2626" class="animate-burst"/>
                                            <g fill="#ef4444"><circle cx="251" cy="108" r="22"/><circle cx="228" cy="80" r="9"/><circle cx="282" cy="86" r="11"/><circle cx="276" cy="140" r="8"/><circle cx="222" cy="138" r="7"/></g>
                                            <text x="251" y="200" text-anchor="middle" fill="#fbbf24" font-size="22" font-weight="800">BURST ✸</text>
                                        </svg>
                                    </div>
                                    <h3 class="text-3xl font-bold text-amber-400">${slideData.haemorrhagicTitle}</h3>
                                    <p class="text-xl md:text-2xl text-slate-300 leading-relaxed">${slideData.haemorrhagicDesc}</p>
                                </div>
                            </div>
                        </div>
                    `;
                case 'cells-counter':
                    return `
                        <div class="slide-container active flex flex-col items-center justify-center text-center space-y-8 w-full max-w-7xl">
                            <div class="text-[90px] md:text-[130px] font-black text-red-500 tracking-tight animate-bounce">${slideData.number}</div>
                            <h2 class="text-3xl md:text-5xl font-extrabold text-slate-100 max-w-6xl leading-snug">${slideData.label}</h2>
                            <div class="bg-teal-600/30 border-2 border-teal-400 px-10 py-5 rounded-full text-3xl md:text-4xl font-bold text-teal-300 animate-pulse">${slideData.cta}</div>
                        </div>
                    `;
                case 'prevention':
                    return `
                        <div class="slide-container active flex flex-col items-center justify-center text-center space-y-8 w-full max-w-7xl">
                            <div class="text-[120px] md:text-[160px] font-black text-teal-400 tracking-tight">${slideData.number}</div>
                            <h1 class="text-5xl md:text-7xl font-black text-amber-400">${slideData.title}</h1>
                            <p class="text-3xl md:text-4xl text-slate-200 max-w-6xl leading-relaxed">${slideData.desc}</p>
                        </div>
                    `;
                case 'risks-exhibition':
                    return `
                        <div class="slide-container active flex flex-col items-center justify-center text-center space-y-6 w-full max-w-7xl">
                            <h1 class="text-4xl md:text-6xl font-black text-red-500">${slideData.title}</h1>
                            <p class="text-2xl md:text-3xl text-amber-400 font-semibold">${slideData.subtitle}</p>
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-8 w-full mt-2">
                                <div class="bg-slate-900/90 border-2 border-red-500/40 p-8 rounded-3xl text-left space-y-4 shadow-xl">
                                    <h3 class="text-3xl font-bold text-red-400 flex items-center space-x-3">
                                        <span>⚠️</span> <span>${slideData.modHeading || 'Modifiable Risks (Can Control)'}</span>
                                    </h3>
                                    <div class="grid grid-cols-1 gap-3">
                                        ${slideData.modifiable.map(item => `
                                            <div class="flex items-center space-x-3 bg-slate-800/80 p-3 rounded-2xl border border-slate-700">
                                                <span class="w-3 h-3 rounded-full bg-red-500"></span>
                                                <span class="text-xl md:text-2xl font-bold text-slate-100">${item}</span>
                                            </div>
                                        `).join('')}
                                    </div>
                                </div>
                                <div class="bg-slate-900/90 border-2 border-amber-500/40 p-8 rounded-3xl text-left space-y-4 shadow-xl">
                                    <h3 class="text-3xl font-bold text-amber-400 flex items-center space-x-3">
                                        <span>🛡️</span> <span>${slideData.nonModHeading || 'Non-Modifiable Risks'}</span>
                                    </h3>
                                    <div class="grid grid-cols-1 gap-3">
                                        ${slideData.nonModifiable.map(item => `
                                            <div class="flex items-center space-x-3 bg-slate-800/80 p-3 rounded-2xl border border-slate-700">
                                                <span class="w-3 h-3 rounded-full bg-amber-400"></span>
                                                <span class="text-xl md:text-2xl font-bold text-slate-100">${item}</span>
                                            </div>
                                        `).join('')}
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                case 'cta-game':
                    return `
                        <div class="slide-container active flex flex-col items-center justify-center text-center space-y-10 w-full max-w-7xl">
                            <div class="w-36 h-36 bg-red-600 rounded-full flex items-center justify-center text-7xl shadow-2xl animate-bounce">🎮</div>
                            <h1 class="text-5xl md:text-7xl font-black text-amber-400 max-w-6xl leading-tight">${slideData.title}</h1>
                            <p class="text-3xl md:text-4xl text-slate-200 max-w-5xl">${slideData.subtitle}</p>
                        </div>
                    `;
                case 'fast':
                    return `
                        <div class="slide-container active flex flex-col items-center justify-center text-center space-y-8 w-full max-w-7xl">
                            <h1 class="text-5xl md:text-7xl font-black text-red-500 tracking-wider">${slideData.title}</h1>
                            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 w-full">
                                ${slideData.items.map((item) => `
                                    <div class="bg-slate-900/90 border-2 border-red-500/50 p-6 rounded-3xl flex flex-col items-center text-center space-y-4 shadow-2xl">
                                        <div class="w-24 h-24 bg-red-600 rounded-2xl flex items-center justify-center text-6xl font-black text-white shadow-lg">${item.letter}</div>
                                        <h3 class="text-3xl font-extrabold text-amber-400">${item.name}</h3>
                                        <p class="text-xl md:text-2xl text-slate-200 leading-normal">${item.desc}</p>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    `;
                case 'signs-other':
                    return `
                        <div class="slide-container active flex flex-col items-center justify-center text-center space-y-8 w-full max-w-7xl">
                            <h1 class="text-5xl md:text-7xl font-black text-amber-400">${slideData.title}</h1>
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 w-full max-w-6xl">
                                ${slideData.items.map((item) => `
                                    <div class="bg-slate-900/90 border border-slate-700 p-8 rounded-3xl flex items-center space-x-6 shadow-xl">
                                        <div class="w-16 h-16 bg-red-500/20 text-red-400 rounded-2xl flex items-center justify-center text-4xl flex-shrink-0">${item.icon}</div>
                                        <span class="text-2xl md:text-3xl font-bold text-slate-100 text-left">${item.text}</span>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    `;
                case 'tia':
                    return `
                        <div class="slide-container active flex flex-col items-center justify-center text-center space-y-8 w-full max-w-7xl">
                            <div class="w-32 h-32 bg-amber-500/20 border-4 border-amber-400 rounded-full flex items-center justify-center text-7xl shadow-2xl animate-pulse">⏳</div>
                            <h1 class="text-5xl md:text-7xl font-black text-amber-400">${slideData.title}</h1>
                            <p class="text-3xl md:text-4xl text-slate-200 max-w-6xl leading-relaxed">${slideData.desc}</p>
                        </div>
                    `;
                case 'emergency':
                    return `
                        <div class="slide-container active flex flex-col items-center justify-center text-center space-y-8 w-full max-w-7xl">
                            <div class="bg-red-600 text-white px-14 py-8 rounded-3xl shadow-2xl flex items-center space-x-8 animate-pulse">
                                <span class="text-7xl">📞</span>
                                <span class="text-7xl md:text-9xl font-black tracking-wider">${slideData.phone}</span>
                            </div>
                            <h1 class="text-4xl md:text-6xl font-black text-amber-400">${slideData.title}</h1>
                            <p class="text-3xl md:text-4xl text-slate-200 max-w-6xl leading-relaxed">${slideData.desc}</p>
                        </div>
                    `;
                default:
                    return `<div class="text-4xl">Slide content loading...</div>`;
            }
        }

        function updateProgressDots() {
            progressDotsEl.innerHTML = '';
            activeIndices.forEach((_, idx) => {
                const dot = document.createElement('div');
                dot.className = `h-3.5 rounded-full transition-all duration-300 ${idx === currentSlideIdx ? 'w-12 bg-amber-400' : 'w-3.5 bg-slate-600'}`;
                progressDotsEl.appendChild(dot);
            });
            counterEl.textContent = `${currentSlideIdx + 1} / ${activeIndices.length}`;
            langIndicator.textContent = currentLang.toUpperCase();
            headerTitle.textContent = `SET: ${currentSetKey.toUpperCase()}`;
            const total = translations.en.slides.length;
            testLabel.textContent = `${currentSetKey} · ${currentLang} · ${activeIndices[currentSlideIdx] + 1}/${total}`;
        }

        function switchSet() {
            currentSetKey = setOrder[(setOrder.indexOf(currentSetKey) + 1) % setOrder.length];
            activeIndices = setIndices[currentSetKey];
            durationPerSlide = slideDurations[currentSetKey] || 7000;
            displaySlide(0);
        }

        function displaySlide(index) {
            if (index < 0) index = activeIndices.length - 1;
            if (index >= activeIndices.length) {
                if (currentSetKey === 'intro' || currentSetKey === 'debrief') {
                    if (window.parent && window.parent !== window) {
                        window.parent.postMessage("slides-finished", "*");
                    }
                }
                index = 0;
                if (rotateLang) currentLang = currentLang === 'en' ? 'ta' : currentLang === 'ta' ? 'si' : 'en';
            }
            currentSlideIdx = index;
            const dataIdx = activeIndices[currentSlideIdx];
            const langDict = translations[currentLang] || translations.en;
            const slideData = langDict.slides[dataIdx];

            wrapper.innerHTML = renderSlideHTML(slideData, langDict);
            updateProgressDots();

            if (slideData.type === 'counter') {
                animateCounter(0, 60000, 2500);
            }

            if (slideTimer) clearTimeout(slideTimer);
            slideTimer = setTimeout(() => {
                displaySlide(currentSlideIdx + 1);
            }, durationPerSlide);
        }

        function animateCounter(start, end, duration) {
            const el = document.getElementById('count-up-num');
            if (!el) return;
            let startTime = null;
            function step(timestamp) {
                if (!startTime) startTime = timestamp;
                let progress = Math.min((timestamp - startTime) / duration, 1);
                let current = Math.floor(progress * (end - start) + start);
                el.textContent = current.toLocaleString();
                if (progress < 1) {
                    window.requestAnimationFrame(step);
                }
            }
            window.requestAnimationFrame(step);
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                displaySlide(currentSlideIdx + 1);
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                displaySlide(currentSlideIdx - 1);
            } else if (e.key === 's' || e.key === 'S') {
                switchSet();
            } else if (e.key === 'l' || e.key === 'L') {
                if (currentLang === 'en') currentLang = 'ta';
                else if (currentLang === 'ta') currentLang = 'si';
                else currentLang = 'en';
                displaySlide(currentSlideIdx);
            }
        });

        window.addEventListener('message', (event) => {
            const data = event.data;
            if (!data) return;
            if (data.cmd === 'setLang' && translations[data.lang]) {
                currentLang = data.lang;
                displaySlide(currentSlideIdx);
            } else if (data.cmd === 'skip') {
                displaySlide(currentSlideIdx + 1);
            }
        });

        window.onload = function() {
            displaySlide(0);
        };
    </script>
</body>
</html>
